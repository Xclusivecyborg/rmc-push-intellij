<!--
  Tool window stripe icon, light theme: the Firebase flame enclosed in curly
  braces — "the config, pushed". Same mark as the VS Code activity bar icon in
  media/rmc-push.svg, so the two IDEs read as one product.

  Sized 20x20: that is the stripe button size in the New UI, which is the only
  UI in current Android Studio and the default since 2024.1. The old 13x13 was
  the classic-UI size, and drew this at two thirds the size of every
  neighbouring tool window icon.

  The 24-unit viewBox is kept so the geometry stays identical to the VS Code
  copy — edit the shape in one place and paste it into the other three files,
  changing only the colour binding. IntelliJ does not recolour tool window
  icons, so the colours are literal here and rmcPushToolWindow_dark.svg carries
  the dark variant; the VS Code copy binds to currentColor instead.

  The flame is the original geometry scaled to 0.786 about (12, 12) so it clears
  the braces by a full unit on each side. That scale is the binding constraint:
  any larger and the flame collides with the brace stems, any smaller and the
  knocked-out arrow closes up at 20px. The arrow is a second subpath cut out by
  fill-rule="evenodd" rather than painted on top, which would need to know the
  stripe's background colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
  <g fill="none" stroke="#6E6E6E" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.2 3.6 Q4.6 3.6 4.6 6.2 L4.6 9.8 Q4.6 12 2.4 12
             Q4.6 12 4.6 14.2 L4.6 17.8 Q4.6 20.4 7.2 20.4"/>
    <path d="M16.8 3.6 Q19.4 3.6 19.4 6.2 L19.4 9.8 Q19.4 12 21.6 12
             Q19.4 12 19.4 14.2 L19.4 17.8 Q19.4 20.4 16.8 20.4"/>
  </g>
  <path fill="#6E6E6E" fill-rule="evenodd"
        d="M10.27 4.45 12.31 8.7 14.2 6.34 17.5 13.26 12 19.55 6.5 13.26Z
           M12 10.27 9.33 13.26h1.73v3.3h1.89v-3.3h1.73Z"/>
</svg>
